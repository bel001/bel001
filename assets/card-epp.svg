@keyframes box { 0%,15% { opacity:0; transform: scale(1.08) } 22%,90% { opacity:1; transform: none } 100% { opacity:0 } }
.bx0 { transform-origin:745px 184px; animation: box 6s 0.0s infinite; opacity:0 }
.bx1 { transform-origin:890px 184px; animation: box 6s 0.5s infinite; opacity:0 }
.bx2 { transform-origin:1035px 184px; animation: box 6s 1.0s infinite; opacity:0 }

</style>
